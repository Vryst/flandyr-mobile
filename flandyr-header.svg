<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .title {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 72px;
        font-weight: 900;
        fill: #e8f4f8;
        letter-spacing: 12px;
        text-transform: uppercase;
      }
      .glitch-r {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 72px;
        font-weight: 900;
        fill: #ff2d55;
        letter-spacing: 12px;
        text-transform: uppercase;
        opacity: 0;
      }
      .glitch-b {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 72px;
        font-weight: 900;
        fill: #00f5d4;
        letter-spacing: 12px;
        text-transform: uppercase;
        opacity: 0;
      }
      .scanline {
        fill: none;
        stroke: rgba(0,245,212,0.08);
        stroke-width: 1;
      }
    </style>

    <!-- Glitch clip paths -->
    <clipPath id="clip1">
      <rect x="0" y="20" width="900" height="30"/>
    </clipPath>
    <clipPath id="clip2">
      <rect x="0" y="70" width="900" height="25"/>
    </clipPath>
    <clipPath id="clip3">
      <rect x="0" y="100" width="900" height="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="#070b14" rx="12"/>

  <!-- Scanlines -->
  <g>
    <line class="scanline" x1="0" y1="10" x2="900" y2="10"/>
    <line class="scanline" x1="0" y1="20" x2="900" y2="20"/>
    <line class="scanline" x1="0" y1="30" x2="900" y2="30"/>
    <line class="scanline" x1="0" y1="40" x2="900" y2="40"/>
    <line class="scanline" x1="0" y1="50" x2="900" y2="50"/>
    <line class="scanline" x1="0" y1="60" x2="900" y2="60"/>
    <line class="scanline" x1="0" y1="70" x2="900" y2="70"/>
    <line class="scanline" x1="0" y1="80" x2="900" y2="80"/>
    <line class="scanline" x1="0" y1="90" x2="900" y2="90"/>
    <line class="scanline" x1="0" y1="100" x2="900" y2="100"/>
    <line class="scanline" x1="0" y1="110" x2="900" y2="110"/>
    <line class="scanline" x1="0" y1="120" x2="900" y2="120"/>
    <line class="scanline" x1="0" y1="130" x2="900" y2="130"/>
    <line class="scanline" x1="0" y1="140" x2="900" y2="140"/>
    <line class="scanline" x1="0" y1="150" x2="900" y2="150"/>
  </g>

  <!-- Decorative left bar -->
  <rect x="36" y="52" width="3" height="56" fill="#00f5d4" rx="2">
    <animate attributeName="opacity" values="1;0.2;1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Decorative right bar -->
  <rect x="861" y="52" width="3" height="56" fill="#ff2d55" rx="2">
    <animate attributeName="opacity" values="1;0.5;0.1;1;0.8;1" dur="2.7s" repeatCount="indefinite"/>
  </rect>

  <!-- Cyan glitch layer -->
  <text class="glitch-b" x="450" y="115" text-anchor="middle" clip-path="url(#clip1)">FLANDYR MOBILE</text>
  <animate xlink:href=".glitch-b" attributeName="opacity" values="0;0;0;0.85;0;0;0;0.7;0;0" dur="4s" repeatCount="indefinite"/>

  <!-- Red glitch layer -->
  <text class="glitch-r" x="450" y="115" text-anchor="middle" clip-path="url(#clip2)">FLANDYR MOBILE</text>
  <animate xlink:href=".glitch-r" attributeName="opacity" values="0;0;0.9;0;0;0;0.6;0;0;0" dur="4s" repeatCount="indefinite"/>

  <!-- Cyan glitch layer animated with transform -->
  <g opacity="0">
    <text class="glitch-b" x="450" y="115" text-anchor="middle" clip-path="url(#clip1)">FLANDYR MOBILE</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,0;4,0;0,0;0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0;0;0.8;0;0;0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Main title -->
  <text class="title" x="450" y="115" text-anchor="middle" id="main">FLANDYR MOBILE
    <animate attributeName="opacity" values="1;1;1;0.85;1;1;0.7;1;1;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Glitch slice 1 - moves horizontally -->
  <g clip-path="url(#clip1)">
    <text class="title" x="450" y="115" text-anchor="middle" fill="#e8f4f8">FLANDYR MOBILE</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;8,0;0,0;-5,0;0,0;0,0;12,0;0,0;0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0.7;0;0;0.85;0;0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Glitch slice 2 -->
  <g clip-path="url(#clip2)">
    <text class="title" x="450" y="115" text-anchor="middle" fill="#00f5d4" opacity="0">FLANDYR MOBILE</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;-10,0;0,0;7,0;0,0;-4,0;0,0;0,0;9,0;0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0;0;0.6;0;0.9;0;0;0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Glitch slice 3 -->
  <g clip-path="url(#clip3)">
    <text class="title" x="450" y="115" text-anchor="middle" fill="#ff2d55" opacity="0">FLANDYR MOBILE</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;5,0;-8,0;0,0;0,0;6,0;0,0;-3,0;0,0;0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.85;0.7;0;0;0;0.6;0;0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="200" y="132" width="500" height="2" fill="url(#linegrad)" rx="1">
    <animate attributeName="width" values="500;480;520;500" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="200;210;190;200" dur="3s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="linegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d55;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#ff2d55;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#00f5d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:0"/>
    </linearGradient>
  </defs>
</svg>
