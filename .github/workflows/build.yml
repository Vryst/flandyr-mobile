name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Start ADB
        run: |
          adb start-server
          sleep 2

      - name: Download Godot
        run: |
          wget -O godot.zip "https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip godot.zip
          ls -la
          chmod +x Godot_v4.6.2-stable_linux.x86_64

      
      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable
          wget https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip Godot_v4.6.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.6.2.stable/

      - name: Configure Android SDK path
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << 'EOF'
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "/usr/local/lib/android/sdk"
export/android/debug_keystore = ""
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
export/android/timestamping_authority_url = ""
export/android/shutdown_adb_on_exit = true
EOF
          
      - name: Build APK
        run: |
          ls -la
          ./Godot_v4.6.2-stable_linux.x86_64 --headless --verbose --export-debug "Flandyr" /home/runner/work/output.apk --path ./prototype/
