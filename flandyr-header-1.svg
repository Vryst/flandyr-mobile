<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150">
  <defs>
    <linearGradient id="linegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff2d55" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ff2d55" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#00f5d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cA"><rect x="0" y="18"  width="860" height="28"/></clipPath>
    <clipPath id="cB"><rect x="0" y="65"  width="860" height="22"/></clipPath>
    <clipPath id="cC"><rect x="0" y="98"  width="860" height="20"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="150" fill="#070b14" rx="10"/>

  <!-- Scanlines (SMIL opacity pulse) -->
  <g stroke="#00f5d4" stroke-width="1" stroke-opacity="0.06">
    <line x1="0" y1="15"  x2="860" y2="15"/>
    <line x1="0" y1="30"  x2="860" y2="30"/>
    <line x1="0" y1="45"  x2="860" y2="45"/>
    <line x1="0" y1="60"  x2="860" y2="60"/>
    <line x1="0" y1="75"  x2="860" y2="75"/>
    <line x1="0" y1="90"  x2="860" y2="90"/>
    <line x1="0" y1="105" x2="860" y2="105"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="135" x2="860" y2="135"/>
  </g>

  <!-- Left accent bar -->
  <rect x="30" y="44" width="3" height="62" fill="#00f5d4" rx="1">
    <animate attributeName="opacity" values="1;0.2;1;0.5;1;0.8;1" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Right accent bar -->
  <rect x="827" y="44" width="3" height="62" fill="#ff2d55" rx="1">
    <animate attributeName="opacity" values="1;0.6;0.1;1;0.4;1;0.9;1" dur="3.1s" repeatCount="indefinite"/>
  </rect>

  <!-- === MAIN TITLE === -->
  <text
    font-family="'Courier New', Courier, monospace"
    font-size="68"
    font-weight="900"
    fill="#e8f4f8"
    x="430" y="108"
    text-anchor="middle"
    letter-spacing="10">FLANDYR MOBILE
    <animate attributeName="opacity"
      values="1;1;1;0.8;1;1;0.6;1;1;0.9;1;1"
      dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- === GLITCH LAYER A — cyan, clip top strip, translate right === -->
  <g clip-path="url(#cA)">
    <text
      font-family="'Courier New', Courier, monospace"
      font-size="68" font-weight="900"
      fill="#00f5d4"
      x="430" y="108"
      text-anchor="middle"
      letter-spacing="10">FLANDYR MOBILE
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 8,0; 0,0; -6,0; 0,0; 10,0; 0,0; 0,0; -4,0; 0,0"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;0;0.85;0;0;0;0.7;0;0.9;0"
        dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- === GLITCH LAYER B — red, clip mid strip, translate left === -->
  <g clip-path="url(#cB)">
    <text
      font-family="'Courier New', Courier, monospace"
      font-size="68" font-weight="900"
      fill="#ff2d55"
      x="430" y="108"
      text-anchor="middle"
      letter-spacing="10">FLANDYR MOBILE
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -7,0; 0,0; 0,0; 5,0; 0,0; -9,0; 0,0; 0,0; 6,0"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;0.9;0;0;0;0.75;0;0.8;0;0"
        dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- === GLITCH LAYER C — white, clip bottom strip === -->
  <g clip-path="url(#cC)">
    <text
      font-family="'Courier New', Courier, monospace"
      font-size="68" font-weight="900"
      fill="#ffffff"
      x="430" y="108"
      text-anchor="middle"
      letter-spacing="10">FLANDYR MOBILE
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; -5,0; 0,0; 8,0; 0,0; 0,0; -6,0; 0,0; 4,0"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;0;0;0.8;0;0;0.65;0;0.75;0"
        dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom gradient line -->
  <rect x="180" y="124" width="500" height="2" fill="url(#linegrad)" rx="1">
    <animate attributeName="width" values="500;460;520;490;500" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x"     values="180;200;170;185;180" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
